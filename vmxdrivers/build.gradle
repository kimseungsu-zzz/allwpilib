plugins {
    id 'cpp'
}

apply plugin: 'edu.wpi.first.NativeUtils'

def vmxBuildEnabled = project.hasProperty('vmxBuild')

description = 'Standalone Studica VMX hardware drivers for Linux aarch64'

apply from: "${rootDir}/shared/config.gradle"

def configuredSdkRoot = providers.gradleProperty('vmxSdkRoot')
        .orElse(providers.environmentVariable('VMX_SDK_ROOT'))
        .orNull
def sdkRoot = configuredSdkRoot ? file(configuredSdkRoot) : file("${buildDir}/vmx-sdk-not-configured")
def sdkIncludeDirs = [
    file("${sdkRoot}/include"),
    file("${sdkRoot}/include/vmxpi")
]
// The vendor SDK mirrors its include layout on the library side, shipping
// lib/vmxpi/libvmxpi_hal_cpp.* rather than lib/. Search both, exactly as
// sdkIncludeDirs already does, so a stock SDK tree is accepted as-is.
def sdkLibraryDirs = [
    file("${sdkRoot}/lib"),
    file("${sdkRoot}/lib/vmxpi")
]

// VMX is an AArch64-only deployment target.  Keep this check independent of
// the host toolchain and of an external `readelf` executable so the same
// guard runs on Windows, Linux, and macOS Gradle hosts.
def isElf64Aarch64 = { byte[] bytes ->
    bytes.length >= 20 &&
            (bytes[0] & 0xff) == 0x7f &&
            (bytes[1] & 0xff) == 0x45 && // E
            (bytes[2] & 0xff) == 0x4c && // L
            (bytes[3] & 0xff) == 0x46 && // F
            (bytes[4] & 0xff) == 2 &&    // ELFCLASS64
            (bytes[5] & 0xff) == 1 &&    // little endian
            ((bytes[18] & 0xff) | ((bytes[19] & 0xff) << 8)) == 183 // EM_AARCH64
}

def isVmxHalLibraryElf64Aarch64 = { File library ->
    byte[] bytes = library.bytes
    if (isElf64Aarch64(bytes)) {
        return true
    }

    // A static SDK may be a GNU ar archive.  Validate every ELF object in the
    // archive while ignoring the symbol-table members, which are not ELF.
    byte[] archiveMagic = '!<arch>\n'.getBytes('US-ASCII')
    if (bytes.length < archiveMagic.length ||
            !java.util.Arrays.equals(java.util.Arrays.copyOfRange(bytes, 0, archiveMagic.length), archiveMagic)) {
        return false
    }

    int offset = archiveMagic.length
    boolean foundElfMember = false
    while (offset + 60 <= bytes.length) {
        String sizeText = new String(bytes, offset + 48, 10, 'US-ASCII').trim()
        long memberSize
        try {
            memberSize = Long.parseLong(sizeText)
        } catch (NumberFormatException ignored) {
            return false
        }
        if (memberSize < 0 || memberSize > Integer.MAX_VALUE || offset + 60L + memberSize > bytes.length) {
            return false
        }

        int memberStart = offset + 60
        int memberEnd = memberStart + (int) memberSize
        byte[] member = java.util.Arrays.copyOfRange(bytes, memberStart, memberEnd)
        boolean memberHasElfMagic = member.length >= 4 &&
                (member[0] & 0xff) == 0x7f &&
                (member[1] & 0xff) == 0x45 &&
                (member[2] & 0xff) == 0x4c &&
                (member[3] & 0xff) == 0x46
        if (memberHasElfMagic) {
            foundElfMember = true
            if (!isElf64Aarch64(member)) {
                return false
            }
        }

        offset = memberEnd + ((memberSize & 1) as int)
    }
    return foundElfMember && offset == bytes.length
}

ext {
    vmxSdkRoot = sdkRoot
    vmxSdkIncludeDirs = sdkIncludeDirs
    vmxSdkLibraryDirs = sdkLibraryDirs
    vmxSdkLibraries = [
        'vmxpi_hal_cpp',
        'rt',
        'pthread',
        'atomic'
    ]
    addVmxdriversDependency = { binary ->
        binary.lib project: ':vmxdrivers', library: 'vmxdrivers', linkage: 'static'

        // A static archive cannot carry system/SDK link flags. Apply them at
        // the final VMX consumer without making that consumer resolve the SDK.
        if (binary instanceof SharedLibraryBinarySpec || binary instanceof NativeExecutableBinarySpec) {
            sdkLibraryDirs.findAll { it.isDirectory() }.each { binary.linker.args "-L${it}" }
            binary.linker.args '-lvmxpi_hal_cpp', '-lrt', '-lpthread', '-latomic'
        }
    }
}

def verifyVmxSdk = tasks.register('verifyVmxSdk') {
    group = 'verification'
    description = 'Checks the VMX SDK layout used by the Linux aarch64 build.'

    doLast {
        if (!configuredSdkRoot) {
            throw new GradleException(
            'VMX SDK is not configured. Set VMX_SDK_ROOT or pass -PvmxSdkRoot=<path>.')
        }

        def header = sdkIncludeDirs.collect { new File(it, 'VMXPi.h') }.find { it.isFile() }
        if (header == null) {
            throw new GradleException(
            "VMXPi.h was not found under ${sdkRoot}/include or ${sdkRoot}/include/vmxpi.")
        }
        def presentLibraryDirs = sdkLibraryDirs.findAll { it.isDirectory() }
        if (presentLibraryDirs.empty) {
            throw new GradleException(
            "VMX SDK library directory does not exist: ${sdkLibraryDirs.join(' or ')}")
        }

        def vmxHalLibraries = presentLibraryDirs.collectMany { directory ->
            fileTree(directory) {
                include 'libvmxpi_hal_cpp.a', 'libvmxpi_hal_cpp.so', 'libvmxpi_hal_cpp.so.*'
            }.files
        }
        if (vmxHalLibraries.empty) {
            throw new GradleException(
            "VMX HAL library was not found in ${presentLibraryDirs.join(' or ')}; " +
            "expected libvmxpi_hal_cpp.a or .so.")
        }

        def incompatibleLibraries = vmxHalLibraries.findAll { !isVmxHalLibraryElf64Aarch64(it) }
        if (!incompatibleLibraries.empty) {
            throw new GradleException(
            "VMX SDK library architecture is incompatible: ${incompatibleLibraries.join(', ')} " +
            "must be ELF64 AArch64 (ELF class 2, little-endian, e_machine 183). " +
            "ELF32/ARMhf artifacts are legacy and rejected; no ARM32 fallback or bridge is supported.")
        }
    }
}

if (vmxBuildEnabled) {
    model {
        components {
            vmxdrivers(NativeLibrarySpec) {
                sources.cpp {
                    source {
                        srcDir projectDir
                        include '*.cpp'
                    }
                    exportedHeaders {
                        srcDir projectDir
                        sdkIncludeDirs.each { srcDir it }
                    }
                }
            }
        }
        binaries {
            all {
                if (!(it instanceof NativeBinarySpec) || it.component.name != 'vmxdrivers') {
                    return
                }

                // Linux aarch64 is a CPU/OS target shared by multiple devices. VMX is
                // selected explicitly by building this component, not inferred from
                // every linuxarm64 WPILib build.
                if (it.targetPlatform.name != nativeUtils.wpi.platforms.linuxarm64 ||
                        it instanceof SharedLibraryBinarySpec) {
                    it.buildable = false
                    return
                }

                it.cppCompiler.args '-pthread'
            }
        }
    }
}

if (vmxBuildEnabled) {
    tasks.withType(CppCompile).configureEach {
        dependsOn verifyVmxSdk
    }
}

tasks.register('printVmxSdkConfiguration') {
    group = 'help'
    description = 'Prints the resolved VMX SDK include/library contract.'
    doLast {
        println "VMX SDK root: ${configuredSdkRoot ?: '<not configured>'}"
        println "VMX SDK includes: ${sdkIncludeDirs.join(', ')}"
        println "VMX SDK libraries: ${sdkLibraryDirs.join(', ')} (${vmxSdkLibraries.join(', ')})"
        println 'VMX target architecture: AArch64 (ELF64 only; ARM32/ELF32 rejected)'
    }
}
